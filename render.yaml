services:
  # Backend Web Service
  - type: web
    name: assessment-portal-api
    env: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    plan: free
    envVars:
      - key: PORT
        value: 5000
      - key: NODE_ENV
        value: production
      - key: USE_JUDGE0
        value: "false"  # Forces local execution inside the Docker container
      - key: MONGODB_URI
        sync: false    # User needs to configure their MongoDB Connection String in Render
      - key: JWT_SECRET
        generateValue: true # Generates a random secret key on deployment
      - key: ADMIN_EMAIL
        value: admin@assessment.com
      - key: ADMIN_PASSWORD
        value: Admin@123456
      - key: ADMIN_NAME
        value: Super Admin

  # Frontend Static Site
  - type: static
    name: assessment-portal-web
    env: node
    rootDir: frontend
    buildCommand: npm install && npm run build
    publishPath: dist
    plan: free
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: assessment-portal-api
          property: host
