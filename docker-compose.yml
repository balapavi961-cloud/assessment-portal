version: '3.8'

services:

  # ─── Backend (Node.js + Java + Python + C++) ─────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: assessment-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    env_file:
      - ./backend/.env
    environment:
      - NODE_ENV=production
      - PORT=5000
      - USE_JUDGE0=false
      - MAX_MEMORY_MB=256
      - CODE_EXEC_TIMEOUT=10000
    mem_limit: 768m          # Limit memory for the backend + JVM spawns
    memswap_limit: 768m      # Disable swap to avoid OOM thrashing
    healthcheck:
      test: >
        node -e "require('http').get('http://localhost:5000/health',
          (r) => { process.exit(r.statusCode === 200 ? 0 : 1) }
        ).on('error', () => process.exit(1))"
      interval: 30s
      timeout: 10s
      start_period: 45s      # Give JVM + Node.js time to fully start
      retries: 3

  # ─── Frontend (Nginx serving Vite static build) ───────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Pass the backend API URL at build time
        VITE_API_URL: "http://localhost:5000/api"
    container_name: assessment-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    mem_limit: 128m