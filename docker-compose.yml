version: '3.8'

services:

  backend:
    build: ./backend
    container_name: assessment-backend
    ports:
      - "5000:5000"
    restart: always
    env_file:
      - ./backend/.env

  frontend:
    build: ./frontend
    container_name: assessment-frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
    restart: always